<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tic Tac Toe</title>
  <style>
    body { font-family: Arial; text-align: center; margin-top: 50px; }
    .board { display: grid; grid-template-columns: repeat(3, 100px); grid-gap: 5px; justify-content: center; }
    .cell { width: 100px; height: 100px; font-size: 48px; display: flex; align-items: center; justify-content: center; background: #f0f0f0; cursor: pointer; }
    .cell:hover { background: #ddd; }
    .info { margin-top: 20px; }
  </style>
</head>
<body>

<h1>Tic Tac Toe</h1>

<div class="board">
  {% for i in range(9) %}
    <a href="{{ url_for('move', cell=i) }}" class="cell">{{ board[i] }}</a>
  {% endfor %}
</div>

<div class="info">
  {% if winner %}
    <h2>{{ winner }} wins!</h2>
    <a href="{{ url_for('reset') }}">Play Again</a>
  {% else %}
    <h2>Current Player: {{ current_player }}</h2>
  {% endif %}
</div>

</body>
</html>
